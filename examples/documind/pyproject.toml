[build-system]
requires = ["hatchling==1.32.3", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "legoai-documind"
version = "0.1.0.dev0"
description = "LegoAI v0.1's first runnable governed AI application: a document ingestion/Q&A CLI over LegoAI's governed runtime, Ollama, and the legoai-document Capability Pack"
requires-python = ">=3.14,<3.15"
dependencies = ["legoai-reference", "legoai-document"]
license = "Apache-2.0"

[project.scripts]
legoai-documind = "documind_app.cli:main"

[tool.uv.sources]
legoai-reference = { path = "../..", editable = true }
legoai-document = { path = "../../packages/legoai-document", editable = true }

[dependency-groups]
dev = [
    "hatchling==1.32.3",
    "editables==0.5",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "coverage==7.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/documind_app"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/testdata", "/README.md", "/pyproject.toml", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["documind_app"]

[tool.coverage.report]
show_missing = true
