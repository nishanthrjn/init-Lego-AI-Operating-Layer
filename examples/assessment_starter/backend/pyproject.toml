[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "assessment-starter"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "legoai-reference",
    "python-dotenv>=1.0,<2",
]

[tool.uv.sources]
legoai-reference = { path = "../../..", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==2.3.1", "ruff==0.16.8", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
