[build-system]
requires = ["hatchling==1.32.3", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "legoai-document"
version = "0.1.0.dev0"
description = "Lego AI Document Capability Pack: document.chunking, document.parsing, document.embedding, document.retrieval, document.rerank, document.ingestion, document.answering"
requires-python = ">=3.14,<3.15"
dependencies = ["pypdf>=6.19.0,<7", "legoai-reference"]

[tool.uv.sources]
legoai-reference = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "hatchling==1.32.3",
    "editables==0.5",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "coverage==7.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legoai_document"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = [
    "legoai_document.chunking",
    "legoai_document.parsing",
    "legoai_document.embedding",
    "legoai_document.retrieval",
    "legoai_document.rerank",
    "legoai_document.ingestion",
    "legoai_document.answering",
]

[tool.coverage.report]
show_missing = true
