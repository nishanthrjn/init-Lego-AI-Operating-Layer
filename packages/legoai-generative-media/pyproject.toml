[build-system]
requires = ["hatchling==1.32.3", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "legoai-generative-media"
version = "0.1.0.dev0"
description = "Bounded local ComfyUI text-to-image integration"
requires-python = ">=3.14,<3.15"
dependencies = ["legoai-reference==0.1.0.dev0"]
license = "Apache-2.0"

[tool.uv.sources]
legoai-reference = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/legoai_generative_media"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
