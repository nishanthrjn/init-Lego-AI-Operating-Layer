[build-system]
requires = ["hatchling==1.32.3", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "legoai-engineering"
version = "0.1.0.dev0"
description = "LegoAI engineering foundation: bounded supplied-text inspection"
requires-python = ">=3.14,<3.15"
dependencies = []
license = "Apache-2.0"

[project.optional-dependencies]
analyst = ["legoai-reference==0.1.0.dev0"]

[tool.uv.sources]
legoai-reference = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "hatchling==1.32.3",
    "editables==0.5",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legoai_engineering"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/sandbox-images", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["examples"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.mypy]
mypy_path = ["examples"]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
