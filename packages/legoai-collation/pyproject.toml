[build-system]
requires = ["hatchling==1.32.3", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "legoai-collation"
version = "0.1.0.dev0"
description = "LegoAI collation: pure precedence collation of source-attributed field readings"
requires-python = ">=3.14,<3.15"
dependencies = []
license = "Apache-2.0"

[dependency-groups]
dev = [
    "hatchling==1.32.3",
    "editables==0.5",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legoai_collation"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
# "src" keeps the tests runnable from an extracted source distribution
# without installing the package first.
pythonpath = ["src", "examples"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.mypy]
mypy_path = ["src", "examples"]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
