[build-system]
requires = ["hatchling==1.32.3", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "legoai-reference"
version = "0.1.0.dev0"
description = "Lego AI reference foundation: nominal identity values"
requires-python = ">=3.14,<3.15"
dependencies = []
license = "Apache-2.0"

[dependency-groups]
dev = [
    "hatchling==1.32.3",
    "editables==0.5",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "coverage==7.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legoai"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs/development.md", "/docs/model-routing.md", "/docs/agent.md", "/docs/ports-and-adapters.md", "/examples/model_port.py", "/examples/model_routing.py", "/examples/agent.py", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["legoai.application", "legoai.reference.application"]

[tool.coverage.report]
show_missing = true
